name: Deploy Node.js App to Kubernetes

on:
  push:
    branches:
      - main   # 👈 This is your event trigger — runs when code is pushed to 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" > ~/.kube/config

    - name: Apply Kubernetes manifests
      run: |
        kubectl apply -f k8s-node-app.yaml
