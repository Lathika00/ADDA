---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nodejs-app
  namespace: default
  labels :
    app: nodejs-app
spec:
  replicas: 1
  selector:
    matchLabeis :
      app: nodejs-app
template:
  metadata :
    labels :
      app: nodejs-app
   spec:
     containers :
      - name: nodejs-app
        image: "lathika/node-app:latest"
        ports :
          - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
    name: nodejs-app
    namespace: default
spec :
  selector:
    app: nodejs-app
  type: nodePort
  ports :
   - name: http
     targetPort: 3000
     port: 80
