apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-app
  labels:
    app: nodejs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: nodejs-app
        image: lathika0325/node-app:latest
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health # Update this if the application has a specific health endpoint
            port: 3000
          initialDelaySeconds: 15 # Increased delay to allow the application to start
          periodSeconds: 10
